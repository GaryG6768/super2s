name: SUPER 2s Automatic Fixtures and Results

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'Europe/London'
    - cron: '15,45 * * * *'
      timezone: 'Europe/London'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Run SUPER 2s automation
        env:
          SUPABASE_URL: 'https://hwgxfgmmupnxhtviuqks.supabase.co'
          SUPABASE_SECRET: ${{ secrets.SUPER2S_SUPABASE_SECRET }}

        run: |
          python - <<'PY'
          import os
          import json
          import random
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          UK = ZoneInfo('Europe/London')
          NOW = datetime.now(UK)

          URL = os.environ['SUPABASE_URL']
          SECRET = os.environ.get('SUPABASE_SECRET', '')

          if not SECRET:
              raise SystemExit(
                  'Missing GitHub secret SUPER2S_SUPABASE_SECRET'
              )

          # ---------------------------------------------------------
          # ESPN DATA
          # ---------------------------------------------------------

          def get_json(url):

              last_error = None

              for attempt in range(3):

                  try:

                      # Do not send a custom User-Agent.
                      # ESPN has been returning HTTP 403 to GitHub
                      # Actions requests carrying the old custom header.
                      req = Request(url)

                      with urlopen(req, timeout=30) as response:
                          return json.loads(
                              response.read().decode()
                          )

                  except Exception as error:

                      last_error = error

                      if attempt < 2:
                          time.sleep(2)

              raise last_error


          # ---------------------------------------------------------
          # SUPABASE RPC
          # ---------------------------------------------------------

          def rpc(name, args):

              body = json.dumps(args).encode()

              req = Request(
                  URL + '/rest/v1/rpc/' + name,
                  data=body,
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': SECRET,
                      'Authorization': 'Bearer ' + SECRET
                  }
              )

              with urlopen(req, timeout=30) as response:

                  raw = response.read().decode()

                  return json.loads(raw) if raw else None


          # ---------------------------------------------------------
          # TUESDAY 08:00 UK
          # SELECT TWO GAMES FOR THE NEW WEEK
          # ---------------------------------------------------------

          if NOW.weekday() == 1 and NOW.hour == 8:

              days_until_friday = (
                  4 - NOW.weekday()
              ) % 7

              friday = (
                  NOW + timedelta(
                      days=days_until_friday
                  )
              ).date()

              monday = friday + timedelta(days=3)

              events = []

              day = friday

              while day <= monday:

                  date_string = day.strftime('%Y%m%d')

                  data = get_json(
                      'https://site.api.espn.com/apis/site/v2/'
                      'sports/soccer/eng.1/scoreboard'
                      '?dates=' + date_string
                  )

                  for event in data.get('events', []):

                      competition = event.get(
                          'competitions',
                          [{}]
                      )[0]

                      timestamp = (
                          event.get('date')
                          or competition.get('date')
                      )

                      if not timestamp:
                          continue

                      kickoff = datetime.fromisoformat(
                          timestamp.replace(
                              'Z',
                              '+00:00'
                          )
                      ).astimezone(UK)

                      if kickoff.weekday() not in (
                          4, 5, 6, 0
                      ):
                          continue

                      teams = competition.get(
                          'competitors',
                          []
                      )

                      if len(teams) != 2:
                          continue

                      home = next(
                          (
                              team
                              for team in teams
                              if team.get('homeAway') == 'home'
                          ),
                          teams[0]
                      )

                      away = next(
                          (
                              team
                              for team in teams
                              if team.get('homeAway') == 'away'
                          ),
                          teams[1]
                      )

                      home_name = home.get(
                          'team',
                          {}
                      ).get('displayName')

                      away_name = away.get(
                          'team',
                          {}
                      ).get('displayName')

                      if home_name and away_name:

                          events.append({
                              'id': event.get('id'),
                              'home': home_name,
                              'away': away_name,
                              'kick': kickoff
                          })

                  day += timedelta(days=1)


              events.sort(
                  key=lambda event: event['kick']
              )


              # Make all possible pairs where the games
              # are at least two hours apart.

              pairs = []

              for i, first in enumerate(events):

                  for second in events[i + 1:]:

                      gap = (
                          second['kick']
                          - first['kick']
                      ).total_seconds()

                      if gap >= 7200:

                          pairs.append(
                              (first, second)
                          )


              if not pairs:

                  raise SystemExit(
                      'No suitable Friday-Monday pair '
                      'with 2-hour gap was found.'
                  )


              game1, game2 = random.choice(pairs)

              payload = {
                  'week_start': friday.isoformat(),

                  'game1_home': game1['home'],
                  'game1_away': game1['away'],
                  'game1_kickoff':
                      game1['kick'].isoformat(),

                  'game2_home': game2['home'],
                  'game2_away': game2['away'],
                  'game2_kickoff':
                      game2['kick'].isoformat()
              }


              body = json.dumps(payload).encode()

              req = Request(
                  URL + '/rest/v1/weeks'
                  '?on_conflict=week_start',
                  data=body,
                  method='POST',
                  headers={
                      'Content-Type':
                          'application/json',
                      'apikey': SECRET,
                      'Authorization':
                          'Bearer ' + SECRET,
                      'Prefer':
                          'resolution=merge-duplicates'
                  }
              )

              with urlopen(req, timeout=30) as response:

                  print(
                      'Weekly games saved:',
                      response.status
                  )


              print(
                  'GAME 1:',
                  game1['home'],
                  'v',
                  game1['away'],
                  game1['kick'].isoformat()
              )

              print(
                  'GAME 2:',
                  game2['home'],
                  'v',
                  game2['away'],
                  game2['kick'].isoformat()
              )


          # ---------------------------------------------------------
          # GET CURRENT SUPER 2s WEEK
          # ---------------------------------------------------------

          req = Request(
              URL +
              '/rest/v1/weeks'
              '?select=*'
              '&order=week_start.desc'
              '&limit=1',
              headers={
                  'apikey': SECRET,
                  'Authorization':
                      'Bearer ' + SECRET
              }
          )

          with urlopen(req, timeout=30) as response:

              weeks = json.loads(
                  response.read().decode()
              )


          if not weeks:

              raise SystemExit(
                  'No SUPER 2s week exists yet.'
              )


          week = weeks[0]


          # ---------------------------------------------------------
          # CHECK BOTH GAMES
          # ---------------------------------------------------------

          games = []


          for home, away, kickoff, number in [

              (
                  week['game1_home'],
                  week['game1_away'],
                  week['game1_kickoff'],
                  1
              ),

              (
                  week['game2_home'],
                  week['game2_away'],
                  week['game2_kickoff'],
                  2
              )

          ]:

              target = datetime.fromisoformat(
                  kickoff.replace(
                      'Z',
                      '+00:00'
                  )
              ).astimezone(UK)


              if target > NOW:

                  continue


              date_string = target.strftime(
                  '%Y%m%d'
              )


              data = get_json(
                  'https://site.api.espn.com/apis/site/v2/'
                  'sports/soccer/eng.1/scoreboard'
                  '?dates=' + date_string
              )


              found = None


              for event in data.get(
                  'events',
                  []
              ):

                  competition = event.get(
                      'competitions',
                      [{}]
                  )[0]

                  teams = competition.get(
                      'competitors',
                      []
                  )


                  names = [

                      team.get(
                          'team',
                          {}
                      ).get('displayName')

                      for team in teams

                  ]


                  if (
                      home in names
                      and
                      away in names
                  ):

                      status = competition.get(
                          'status',
                          {}
                      ).get(
                          'type',
                          {}
                      )


                      if status.get('completed'):

                          home_team = next(
                              team
                              for team in teams
                              if team.get(
                                  'team',
                                  {}
                              ).get(
                                  'displayName'
                              ) == home
                          )


                          away_team = next(
                              team
                              for team in teams
                              if team.get(
                                  'team',
                                  {}
                              ).get(
                                  'displayName'
                              ) == away
                          )


                          found = (
                              int(
                                  home_team.get(
                                      'score'
                                  )
                              ),
                              int(
                                  away_team.get(
                                      'score'
                                  )
                              )
                          )

                          break


              games.append(
                  (number, found)
              )


          # ---------------------------------------------------------
          # SAVE ANY COMPLETED SCORES
          # ---------------------------------------------------------

          updates = {}


          for number, score in games:

              if score is not None:

                  updates[
                      'game%d_score_home' % number
                  ] = score[0]

                  updates[
                      'game%d_score_away' % number
                  ] = score[1]


          if updates:

              # Leave the week OPEN here.
              # The database settlement function decides whether
              # the round is finished.

              updates['status'] = 'open'


              body = json.dumps(
                  updates
              ).encode()


              req = Request(
                  URL +
                  '/rest/v1/weeks'
                  '?id=eq.' + week['id'],

                  data=body,

                  method='PATCH',

                  headers={
                      'Content-Type':
                          'application/json',

                      'apikey':
                          SECRET,

                      'Authorization':
                          'Bearer ' + SECRET,

                      'Prefer':
                          'return=minimal'
                  }
              )


              with urlopen(
                  req,
                  timeout=30
              ) as response:

                  print(
                      'Scores updated:',
                      response.status,
                      updates
                  )

          else:

              print(
                  'No completed score changes found.'
              )


          # ---------------------------------------------------------
          # RE-READ WEEK
          # ---------------------------------------------------------

          req = Request(
              URL +
              '/rest/v1/weeks'
              '?id=eq.' + week['id'] +
              '&select=*',

              headers={
                  'apikey': SECRET,
                  'Authorization':
                      'Bearer ' + SECRET
              }
          )


          with urlopen(
              req,
              timeout=30
          ) as response:

              latest_rows = json.loads(
                  response.read().decode()
              )


          if not latest_rows:

              print(
                  'No week found after score update.'
              )

              raise SystemExit(0)


          current = latest_rows[0]


          # ---------------------------------------------------------
          # SETTLE THE ROUND
          # ---------------------------------------------------------
          #
          # Game 1 finished + players remain:
          #     round stays open.
          #
          # Game 1 finished + NO players remain:
          #     round finishes immediately and the next
          #     scheduled week is opened.
          #
          # Both games finished:
          #     winner is determined normally.
          #

          game1_finished = (
              current.get(
                  'game1_score_home'
              ) is not None
              and
              current.get(
                  'game1_score_away'
              ) is not None
          )


          if game1_finished:

              try:

                  result = rpc(
                      'settle_week_and_activate_next',
                      {
                          'p_week_id':
                              current['id']
                      }
                  )


                  print(
                      'Settlement checked:',
                      result
                  )


              except Exception as error:

                  print(
                      'Settlement check failed:',
                      error
                  )

          else:

              print(
                  'Game 1 has not finished yet.'
              )


          PY
