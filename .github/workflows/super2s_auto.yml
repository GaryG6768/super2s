name: Super 2s Automatic Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'Europe/London'
    - cron: '*/5 * * * *'
      timezone: 'Europe/London'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Run SUPER 2s automation
        env:
          SUPABASE_URL: 'https://hwgxfgmmupnxhtviuqks.supabase.co'
          SUPABASE_SECRET: ${{ secrets.SUPER2S_SUPABASE_SECRET }}

        run: |
          python - <<'PY'
          import os
          import json
          import random
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          UK = ZoneInfo('Europe/London')
          NOW = datetime.now(UK)

          URL = os.environ['SUPABASE_URL']
          SECRET = os.environ.get('SUPABASE_SECRET', '')

          if not SECRET:
              raise SystemExit('Missing GitHub secret SUPER2S_SUPABASE_SECRET')

          def get_json(url):
              req = Request(
                  url,
                  headers={'User-Agent': 'SUPER2s/1.0'}
              )
              with urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def rpc(name, args):
              body = json.dumps(args).encode()
              req = Request(
                  URL + '/rest/v1/rpc/' + name,
                  data=body,
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': SECRET,
                      'Authorization': 'Bearer ' + SECRET
                  }
              )
              with urlopen(req, timeout=30) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw else None

          # ============================================================
          # TUESDAY 08:00 UK
          # Select the two games for the coming Friday-Monday window.
          # The new week is created as SCHEDULED so it does not replace
          # the currently LIVE week.
          # ============================================================

          if (
              (NOW.weekday() == 1 and NOW.hour == 8)
              or os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          ):

              days_until_friday = (4 - NOW.weekday()) % 7
              friday = (NOW + timedelta(days=days_until_friday)).date()
              monday = friday + timedelta(days=3)

              start = datetime.combine(
                  friday,
                  datetime.min.time(),
                  UK
              )

              end = datetime.combine(
                  monday + timedelta(days=1),
                  datetime.min.time(),
                  UK
              )

              events = []

              day = start.date()

              while day < end.date():

                  d = day.strftime('%Y%m%d')

                  data = get_json(
                      'https://site.web.api.espn.com/apis/site/v2/sports/'
                      'soccer/eng.1/scoreboard?dates=' + d
                  )

                  for e in data.get('events', []):

                      c = e.get('competitions', [{}])[0]

                      ts = e.get('date') or c.get('date')

                      if not ts:
                          continue

                      dt = datetime.fromisoformat(
                          ts.replace('Z', '+00:00')
                      ).astimezone(UK)

                      if dt.weekday() not in (4, 5, 6, 0):
                          continue

                      teams = c.get('competitors', [])

                      if len(teams) != 2:
                          continue

                      home = next(
                          (x for x in teams if x.get('homeAway') == 'home'),
                          teams[0]
                      )

                      away = next(
                          (x for x in teams if x.get('homeAway') == 'away'),
                          teams[1]
                      )

                      events.append({
                          'id': e.get('id'),
                          'home': home.get('team', {}).get('displayName'),
                          'away': away.get('team', {}).get('displayName'),
                          'kick': dt
                      })

                  day += timedelta(days=1)

              events = [
                  e for e in events
                  if e['home'] and e['away']
              ]

              events.sort(key=lambda x: x['kick'])

              pairs = []

              for i, a in enumerate(events):

                  for b in events[i + 1:]:

                      if abs(
                          (b['kick'] - a['kick']).total_seconds()
                      ) >= 7200:

                          pairs.append((a, b))

              if not pairs:
                  raise SystemExit(
                      'No suitable Friday-Monday pair with 2-hour gap was found.'
                  )

              a, b = random.choice(pairs)

              week_start = friday.isoformat()

              payload = {
                  'week_start': week_start,

                  'game1_home': a['home'],
                  'game1_away': a['away'],
                  'game1_kickoff': a['kick'].isoformat(),

                  'game2_home': b['home'],
                  'game2_away': b['away'],
                  'game2_kickoff': b['kick'].isoformat(),

                  'status': 'scheduled',
                  'pot_processed': False
              }

              body = json.dumps(payload).encode()

              req = Request(
                  URL + '/rest/v1/weeks?on_conflict=week_start',
                  data=body,
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': SECRET,
                      'Authorization': 'Bearer ' + SECRET,

                      # IMPORTANT:
                      # Never overwrite an existing week.
                      'Prefer': 'resolution=ignore-duplicates'
                  }
              )

              with urlopen(req, timeout=30) as r:
                  print('Weekly games saved:', r.status)

              print(
                  'Game 1:',
                  a['home'],
                  'v',
                  a['away'],
                  a['kick'].isoformat()
              )

              print(
                  'Game 2:',
                  b['home'],
                  'v',
                  b['away'],
                  b['kick'].isoformat()
              )

          # ============================================================
          # EVERY 5 MINUTES
          #
          # Process ALL currently OPEN weeks.
          # This is important because the next week may already exist
          # as SCHEDULED while the current week is still OPEN.
          # ============================================================

          req = Request(
              URL +
              '/rest/v1/weeks?select=*'
              '&status=eq.open'
              '&order=week_start.asc',
              headers={
                  'apikey': SECRET,
                  'Authorization': 'Bearer ' + SECRET
              }
          )

          with urlopen(req, timeout=30) as r:
              weeks = json.loads(r.read().decode())

          if not weeks:
              print('No open SUPER 2s week currently exists.')
          else:

              print(
                  'Open weeks found:',
                  len(weeks)
              )

              for w in weeks:

                  print(
                      'Checking week:',
                      w['week_start'],
                      w['id']
                  )

                  games = []

                  for home, away, kick, num in [
                      (
                          w['game1_home'],
                          w['game1_away'],
                          w['game1_kickoff'],
                          1
                      ),
                      (
                          w['game2_home'],
                          w['game2_away'],
                          w['game2_kickoff'],
                          2
                      )
                  ]:

                      target = datetime.fromisoformat(
                          kick.replace('Z', '+00:00')
                      ).astimezone(UK)

                      if target > NOW:
                          games.append((num, None))
                          continue

                      d = target.strftime('%Y%m%d')

                      data = get_json(
                          'https://site.web.api.espn.com/apis/site/v2/sports/'
                          'soccer/eng.1/scoreboard?dates=' + d
                      )

                      found = None

                      for e in data.get('events', []):

                          c = e.get('competitions', [{}])[0]

                          teams = c.get('competitors', [])

                          names = [
                              x.get('team', {}).get('displayName')
                              for x in teams
                          ]

                          if home in names and away in names:

                              status = c.get(
                                  'status',
                                  {}
                              ).get(
                                  'type',
                                  {}
                              )

                              if status.get('completed'):

                                  home_team = next(
                                      x for x in teams
                                      if x.get('team', {}).get(
                                          'displayName'
                                      ) == home
                                  )

                                  away_team = next(
                                      x for x in teams
                                      if x.get('team', {}).get(
                                          'displayName'
                                      ) == away
                                  )

                                  hs = home_team.get('score')
                                  aas = away_team.get('score')

                                  if hs is not None and aas is not None:

                                      found = (
                                          int(hs),
                                          int(aas)
                                      )

                                  break

                      games.append((num, found))

                  # ----------------------------------------------------
                  # Save any newly completed scores.
                  #
                  # IMPORTANT:
                  # Do NOT change the week to FINISHED here.
                  # The settlement RPC handles that.
                  # ----------------------------------------------------

                  updates = {}

                  for num, score in games:

                      if score:

                          updates[
                              'game%d_score_home' % num
                          ] = score[0]

                          updates[
                              'game%d_score_away' % num
                          ] = score[1]

                  if updates:

                      updates['status'] = 'open'

                      body = json.dumps(updates).encode()

                      req = Request(
                          URL +
                          '/rest/v1/weeks?id=eq.' +
                          w['id'],

                          data=body,
                          method='PATCH',

                          headers={
                              'Content-Type': 'application/json',
                              'apikey': SECRET,
                              'Authorization': 'Bearer ' + SECRET,
                              'Prefer': 'return=minimal'
                          }
                      )

                      with urlopen(req, timeout=30) as r:

                          print(
                              'Scores updated:',
                              r.status,
                              updates
                          )

                  else:

                      print(
                          'No completed score changes found.'
                      )

                  # ----------------------------------------------------
                  # SETTLE THE WEEK.
                  #
                  # The Supabase RPC decides:
                  #
                  # 1. Has Game 1 finished?
                  # 2. Has Game 2 finished?
                  # 3. Is there a winner?
                  # 4. Should the pot reset?
                  # 5. Should the pot carry over?
                  # 6. Should the next scheduled week become OPEN?
                  # ----------------------------------------------------

                  try:

                      result = rpc(
                          'settle_week_and_activate_next',
                          {
                              'p_week_id': w['id']
                          }
                      )

                      print(
                          'Settlement result:',
                          result
                      )

                  except Exception as e:

                      print(
                          'Settlement check failed:',
                          str(e)
                      )

          print('SUPER 2s automation completed.')
          PY
