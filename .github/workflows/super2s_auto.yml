name: SUPER 2s Automatic Fixtures and Results

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'Europe/London'
    - cron: '15,45 * * * *'
      timezone: 'Europe/London'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run SUPER 2s automation
        env:
          SUPABASE_URL: 'https://hwgxfgmmupnxhtviuqks.supabase.co'
          SUPABASE_SECRET: ${{ secrets.SUPER2S_SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import os, json, random, time
          from datetime import datetime, timedelta, date
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          UK = ZoneInfo('Europe/London')
          NOW = datetime.now(UK)
          URL = os.environ['SUPABASE_URL']
          SECRET = os.environ.get('SUPABASE_SECRET', '')

          if not SECRET:
              raise SystemExit('Missing GitHub secret SUPER2S_SUPABASE_SECRET')

          def get_json(url):
              last_error = None
              for attempt in range(3):
                  try:
                      with urlopen(Request(url), timeout=30) as response:
                          return json.loads(response.read().decode())
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(2)
              raise last_error

          def supabase(method, path, payload=None, prefer=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {
                  'apikey': SECRET,
                  'Authorization': 'Bearer ' + SECRET
              }
              if payload is not None:
                  headers['Content-Type'] = 'application/json'
              if prefer:
                  headers['Prefer'] = prefer
              req = Request(URL + path, data=data, method=method, headers=headers)
              with urlopen(req, timeout=30) as response:
                  raw = response.read().decode()
                  return json.loads(raw) if raw else None

          def rpc(name, args):
              return supabase('POST', '/rest/v1/rpc/' + name, args)

          def get_fixture_pair(friday):
              monday = friday + timedelta(days=3)
              events = []
              day = friday

              while day <= monday:
                  data = get_json(
                      'https://site.api.espn.com/apis/site/v2/'
                      'sports/soccer/eng.1/scoreboard'
                      '?dates=' + day.strftime('%Y%m%d')
                  )

                  for event in data.get('events', []):
                      competition = event.get('competitions', [{}])[0]
                      timestamp = event.get('date') or competition.get('date')
                      if not timestamp:
                          continue

                      kickoff = datetime.fromisoformat(
                          timestamp.replace('Z', '+00:00')
                      ).astimezone(UK)

                      if kickoff.weekday() not in (4, 5, 6, 0):
                          continue

                      teams = competition.get('competitors', [])
                      if len(teams) != 2:
                          continue

                      home = next(
                          (t for t in teams if t.get('homeAway') == 'home'),
                          teams[0]
                      )
                      away = next(
                          (t for t in teams if t.get('homeAway') == 'away'),
                          teams[1]
                      )

                      home_name = home.get('team', {}).get('displayName')
                      away_name = away.get('team', {}).get('displayName')

                      if home_name and away_name:
                          events.append({
                              'home': home_name,
                              'away': away_name,
                              'kick': kickoff
                          })

                  day += timedelta(days=1)

              events.sort(key=lambda x: x['kick'])
              pairs = []

              for i, first in enumerate(events):
                  for second in events[i + 1:]:
                      if (second['kick'] - first['kick']).total_seconds() >= 7200:
                          pairs.append((first, second))

              if not pairs:
                  raise SystemExit(
                      'No suitable Friday-Monday pair with a 2-hour gap was found.'
                  )

              return random.choice(pairs)

          def create_scheduled_week(friday, open_now=False):
              game1, game2 = get_fixture_pair(friday)

              payload = {
                  'week_start': friday.isoformat(),
                  'game1_home': game1['home'],
                  'game1_away': game1['away'],
                  'game1_kickoff': game1['kick'].isoformat(),
                  'game2_home': game2['home'],
                  'game2_away': game2['away'],
                  'game2_kickoff': game2['kick'].isoformat()
              }

              supabase(
                  'POST',
                  '/rest/v1/weeks?on_conflict=week_start',
                  payload,
                  'resolution=ignore-duplicates,return=minimal'
              )

              if open_now:
                  supabase(
                      'PATCH',
                      '/rest/v1/weeks?week_start=eq.' + friday.isoformat(),
                      {'status': 'open'},
                      'return=minimal'
                  )

              print(
                  'Week ready:',
                  friday.isoformat(),
                  '|',
                  game1['home'], 'v', game1['away'],
                  '|',
                  game2['home'], 'v', game2['away'],
                  '| open =', open_now
              )

          # TUESDAY 08:00 - CREATE THE WEEK IF IT DOES NOT EXIST
          if NOW.weekday() == 1 and NOW.hour == 8:
              days_until_friday = (4 - NOW.weekday()) % 7
              friday = (NOW + timedelta(days=days_until_friday)).date()

              existing_path = (
                  '/rest/v1/weeks'
                  '?select=id,week_start,status'
                  '&week_start=eq.' + friday.isoformat()
                  + '&limit=1'
              )

              existing = supabase(
                  'GET',
                  existing_path
              )

              if existing:
                  print('Tuesday: week already exists:', friday.isoformat())
              else:
                  create_scheduled_week(friday, open_now=False)

          # GET LATEST WEEK
          weeks = supabase(
              'GET',
              '/rest/v1/weeks'
              '?select=*'
              '&order=week_start.desc'
              '&limit=1'
          )

          if not weeks:
              raise SystemExit('No SUPER 2s week exists yet.')

          week = weeks[0]

          # CHECK BOTH GAMES
          games = []

          for home, away, kickoff, number in [
              (
                  week['game1_home'],
                  week['game1_away'],
                  week['game1_kickoff'],
                  1
              ),
              (
                  week['game2_home'],
                  week['game2_away'],
                  week['game2_kickoff'],
                  2
              )
          ]:
              target = datetime.fromisoformat(
                  kickoff.replace('Z', '+00:00')
              ).astimezone(UK)

              if target > NOW:
                  continue

              data = get_json(
                  'https://site.api.espn.com/apis/site/v2/'
                  'sports/soccer/eng.1/scoreboard'
                  '?dates=' + target.strftime('%Y%m%d')
              )

              found = None

              for event in data.get('events', []):
                  competition = event.get('competitions', [{}])[0]
                  teams = competition.get('competitors', [])
                  names = [
                      team.get('team', {}).get('displayName')
                      for team in teams
                  ]

                  if home in names and away in names:
                      status = competition.get('status', {}).get('type', {})
                      if status.get('completed'):
                          home_team = next(
                              t for t in teams
                              if t.get('team', {}).get('displayName') == home
                          )
                          away_team = next(
                              t for t in teams
                              if t.get('team', {}).get('displayName') == away
                          )
                          found = (
                              int(home_team.get('score')),
                              int(away_team.get('score'))
                          )
                          break

              games.append((number, found))

          # SAVE COMPLETED SCORES
          updates = {}

          for number, score in games:
              if score is not None:
                  updates['game%d_score_home' % number] = score[0]
                  updates['game%d_score_away' % number] = score[1]

          if updates:
              # Never reopen a round that has already been settled.
              # The score can still be updated, but a finished round
              # must remain finished so the next round can be created.
              if week.get('status') != 'finished':
                  updates['status'] = 'open'

              supabase(
                  'PATCH',
                  '/rest/v1/weeks?id=eq.' + week['id'],
                  updates,
                  'return=minimal'
              )

              print('Scores updated:', updates)
          else:
              print('No completed score changes found.')

          # RE-READ CURRENT WEEK
          current_path = (
              '/rest/v1/weeks'
              '?id=eq.' + week['id']
              + '&select=*'
          )

          current_rows = supabase(
              'GET',
              current_path
          )

          if not current_rows:
              raise SystemExit('No week found after score update.')

          current = current_rows[0]

          game1_finished = (
              current.get('game1_score_home') is not None
              and current.get('game1_score_away') is not None
          )

          # SETTLE
          if game1_finished and current.get('status') == 'open':
              try:
                  result = rpc(
                      'settle_week_and_activate_next',
                      {'p_week_id': current['id']}
                  )
                  print('Settlement checked:', result)
              except Exception as error:
                  print('Settlement check failed:', error)
          else:
              print(
                  'Settlement not required:',
                  'game1_finished =', game1_finished,
                  '| status =', current.get('status')
              )

          # IF THE ROUND FINISHED AND THERE IS NO FUTURE SCHEDULED
          # WEEK, CREATE AND OPEN THE NEXT ROUND NOW.
          settled_path = (
              '/rest/v1/weeks'
              '?id=eq.' + current['id']
              + '&select=id,week_start,status'
          )

          settled_rows = supabase(
              'GET',
              settled_path
          )

          if settled_rows and settled_rows[0].get('status') == 'finished':
              current_start = date.fromisoformat(
                  settled_rows[0]['week_start']
              )

              future_path = (
                  '/rest/v1/weeks'
                  '?select=id,week_start,status'
                  '&week_start=gt.' + current_start.isoformat()
                  + '&status=eq.scheduled'
                  + '&order=week_start.asc'
                  + '&limit=1'
              )

              future = supabase(
                  'GET',
                  future_path
              )

              if future:
                  print(
                      'Future scheduled week already exists:',
                      future[0]['week_start']
                  )

                  # The settlement function normally opens this week.
                  # If it did not, open it here.
                  supabase(
                      'PATCH',
                      '/rest/v1/weeks?id=eq.' + future[0]['id'],
                      {'status': 'open'},
                      'return=minimal'
                  )
              else:
                  days_ahead = (4 - current_start.weekday()) % 7
                  if days_ahead == 0:
                      days_ahead = 7

                  next_friday = current_start + timedelta(days=days_ahead)

                  print(
                      'No future scheduled week found. Creating and opening:',
                      next_friday.isoformat()
                  )

                  create_scheduled_week(
                      next_friday,
                      open_now=True
                  )
          PY
