name: Super 2s Automatic Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'Europe/London'
    - cron: '15,45 * * * *'
      timezone: 'Europe/London'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run SUPER 2s automation
        env:
          SUPABASE_URL: 'https://hwgxfgmmupnxhtviuqks.supabase.co'
          SUPABASE_SECRET: ${{ secrets.SUPER2S_SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import os, json, random
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          UK = ZoneInfo('Europe/London')
          NOW = datetime.now(UK)
          URL = os.environ['SUPABASE_URL']
          SECRET = os.environ.get('SUPABASE_SECRET','')
          if not SECRET:
              raise SystemExit('Missing GitHub secret SUPER2S_SUPABASE_SECRET')

          def get_json(url):
              req=Request(url, headers={'User-Agent':'SUPER2s/1.0'})
              with urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def rpc(name, args):
              body=json.dumps(args).encode()
              req=Request(URL+'/rest/v1/rpc/'+name, data=body,
                          headers={'Content-Type':'application/json','apikey':SECRET,
                                   'Authorization':'Bearer '+SECRET})
              with urlopen(req, timeout=30) as r:
                  raw=r.read().decode()
                  return json.loads(raw) if raw else None

          # Tuesday 08:00 UK: select the two games for the coming Friday-Monday window.
          if NOW.weekday() == 1 and NOW.hour == 8:
              days_until_friday = (4 - NOW.weekday()) % 7
              friday = (NOW + timedelta(days=days_until_friday)).date()
              monday = friday + timedelta(days=3)
              start = datetime.combine(friday, datetime.min.time(), UK)
              end = datetime.combine(monday + timedelta(days=1), datetime.min.time(), UK)

              events=[]
              day=start.date()
              while day < end.date():
                  d=day.strftime('%Y%m%d')
                  data=get_json(f'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates={d}')
                  for e in data.get('events',[]):
                      c=e.get('competitions',[{}])[0]
                      ts=e.get('date') or c.get('date')
                      if not ts: continue
                      dt=datetime.fromisoformat(ts.replace('Z','+00:00')).astimezone(UK)
                      if dt.weekday() not in (4,5,6,0): continue
                      teams=c.get('competitors',[])
                      if len(teams)!=2: continue
                      home=next((x for x in teams if x.get('homeAway')=='home'),teams[0])
                      away=next((x for x in teams if x.get('homeAway')=='away'),teams[1])
                      events.append({'id':e.get('id'),'home':home.get('team',{}).get('displayName'),
                                     'away':away.get('team',{}).get('displayName'),'kick':dt})
                  day += timedelta(days=1)

              events=[e for e in events if e['home'] and e['away']]
              events.sort(key=lambda x:x['kick'])
              pairs=[]
              for i,a in enumerate(events):
                  for b in events[i+1:]:
                      if abs((b['kick']-a['kick']).total_seconds()) >= 7200:
                          pairs.append((a,b))
              if not pairs:
                  raise SystemExit('No suitable Friday-Monday pair with 2-hour gap was found.')
              # Stable random choice for this weekly draw, then stored centrally in Supabase.
              a,b=random.choice(pairs)
              week_start=friday.isoformat()
              payload={'week_start':week_start,'game1_home':a['home'],'game1_away':a['away'],
                       'game1_kickoff':a['kick'].isoformat(),'game2_home':b['home'],
                       'game2_away':b['away'],'game2_kickoff':b['kick'].isoformat()}
              # Direct table write; secret key bypasses RLS.
              body=json.dumps(payload).encode()
              req=Request(URL+'/rest/v1/weeks?on_conflict=week_start',data=body,method='POST',
                          headers={'Content-Type':'application/json','apikey':SECRET,
                                   'Authorization':'Bearer '+SECRET,'Prefer':'resolution=merge-duplicates'})
              with urlopen(req,timeout=30) as r:
                  print('Weekly games saved:', r.status)
              print(a['home'], 'v', a['away'], a['kick'].isoformat())
              print(b['home'], 'v', b['away'], b['kick'].isoformat())

          # Every 30 minutes: update the stored scores for the current week's games.
          # This is intentionally conservative: only update scores when ESPN says a game is final.
          # Fetch the latest week row.
          req=Request(URL+'/rest/v1/weeks?select=*&order=week_start.desc&limit=1',
                      headers={'apikey':SECRET,'Authorization':'Bearer '+SECRET})
          with urlopen(req,timeout=30) as r:
              rows=json.loads(r.read().decode())
          if not rows:
              raise SystemExit('No SUPER 2s week exists yet.')
          w=rows[0]

          games=[]
          for home,away,kick,num in [(w['game1_home'],w['game1_away'],w['game1_kickoff'],1),
                                     (w['game2_home'],w['game2_away'],w['game2_kickoff'],2)]:
              target=datetime.fromisoformat(kick.replace('Z','+00:00')).astimezone(UK)
              if target > NOW: continue
              d=target.strftime('%Y%m%d')
              data=get_json(f'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates={d}')
              found=None
              for e in data.get('events',[]):
                  c=e.get('competitions',[{}])[0]
                  teams=c.get('competitors',[])
                  names=[x.get('team',{}).get('displayName') for x in teams]
                  if home in names and away in names:
                      status=c.get('status',{}).get('type',{})
                      if status.get('completed'):
                          hs=next(x for x in teams if x.get('team',{}).get('displayName')==home).get('score')
                          aas=next(x for x in teams if x.get('team',{}).get('displayName')==away).get('score')
                          found=(int(hs),int(aas))
                          break
              games.append((num,found))

          updates={}
          for num,score in games:
              if score:
                  updates['game%d_score_home'%num]=score[0]
                  updates['game%d_score_away'%num]=score[1]
          if updates:
              updates['status']='finished' if all(k in updates for k in ['game1_score_home','game1_score_away','game2_score_home','game2_score_away']) else 'open'
              body=json.dumps(updates).encode()
              req=Request(URL+'/rest/v1/weeks?id=eq.'+w['id'],data=body,method='PATCH',
                          headers={'Content-Type':'application/json','apikey':SECRET,
                                   'Authorization':'Bearer '+SECRET,'Prefer':'return=minimal'})
              with urlopen(req,timeout=30) as r:
                  print('Scores updated:', r.status, updates)
          else:
              print('No completed score changes found.')
          PY
